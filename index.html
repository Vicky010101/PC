<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Download Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0e172a;
      color: #fff;
      margin: 0;
    }
    .container {
      text-align: center;
      background: #1e293b;
      padding: 35px;
      border-radius: 15px;
    }
    button {
      background: #22c55e;
      color: #022c22;
      border: none;
      padding: 12px 25px;
      margin: 8px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Download Files</h2>
    <p>Click below to download your PDFs</p>

    <button onclick="downloadPDF('mypdf.pdf')">Mannual PDF 1</button>
    <button onclick="downloadPDF('output.pdf')">Output PDF 2</button>
  </div>

  <script>
    function downloadPDF(filename) {
      let a = document.createElement("a");
      a.href = filename;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
