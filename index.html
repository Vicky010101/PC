<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PDF Download Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b, #020617);
            color: #f9fafb;
        }

        .container {
            text-align: center;
            padding: 2.5rem 2rem;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            color: #cbd5f5;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.4rem;
            border-radius: 999px;
            border: none;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin: 0.25rem;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .primary {
            background: #22c55e;
            color: #022c22;
        }

        .secondary {
            background: #38bdf8;
            color: #0b1120;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Download My PDF</h1>
        <p>Click the button below to download the file.</p>

        <button id="downloadBtn" class="btn primary">Download PDF</button>
    </div>

    <script>
        document.getElementById("downloadBtn").addEventListener("click", () => {
            const pdfFile = "mypdf.pdf"; // <-- Change to your PDF name

            const link = document.createElement("a");
            link.href = pdfFile;
            link.download = pdfFile;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body>

</html>
